name: Deploy contribution service

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-contribution-service
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 CLOUDFLARE_API_TOKEN，跳过部署。配置见 deployment.md。"
          fi
      - uses: prefix-dev/setup-pixi@v0.9.0
        if: steps.credentials.outputs.ready == 'true'
        with:
          pixi-version: latest
          manifest-path: pixi.toml
      - name: Verify
        if: steps.credentials.outputs.ready == 'true'
        run: |
          pixi run check
          pixi run test
      - name: Apply D1 migrations
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 d1 migrations apply what-to-eat-in-shou-contributions --remote
      - name: Deploy Worker
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 deploy
